<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#0a1128"/>
    </linearGradient>
    <linearGradient id="anchorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f1de"/>
      <stop offset="100%" stop-color="#e0ded0"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#e0ded0" stroke-opacity="0.12" stroke-width="2"/>
  <g filter="url(#subtleGlow)" fill="url(#anchorGrad)">
    <!-- Top ring -->
    <circle cx="256" cy="116" r="32" fill="none" stroke="url(#anchorGrad)" stroke-width="18"/>
    <circle cx="256" cy="116" r="14" fill="#14213d"/>
    <!-- Crossbar -->
    <rect x="180" y="176" width="152" height="18" rx="9"/>
    <circle cx="180" cy="185" r="12"/>
    <circle cx="332" cy="185" r="12"/>
    <!-- Central Stock / Shaft -->
    <rect x="247" y="140" width="18" height="236" rx="9"/>
    <!-- Curved Flukes -->
    <path d="M 126 270 C 130 376 210 422 256 422 C 302 422 382 376 386 270 C 372 272 358 278 350 288 C 342 356 290 398 256 398 C 222 398 170 356 162 288 C 154 278 140 272 126 270 Z"/>
    <!-- Fluke Arrowheads -->
    <polygon points="126,260 102,298 152,298"/>
    <polygon points="386,260 360,298 410,298"/>
    <!-- Center crown dot -->
    <circle cx="256" cy="426" r="9"/>
  </g>
</svg>
